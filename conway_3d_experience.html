<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Life 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }

        #info h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        #info p {
            margin: 5px 0;
            color: #ccc;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
        }

        #controls h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        button {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #6bcfff, #4fc3f7);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .slider-container {
            margin: 10px 0;
        }

        .slider-container label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        .slider-container input[type="range"] {
            width: 200px;
            height: 5px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 5px;
            outline: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: #4fc3f7;
            border-radius: 50%;
            cursor: pointer;
        }

        .view-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .view-indicator.visible {
            opacity: 1;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="loading">Cargando experiencia...</div>
    <div id="info">
        <h1>Juego de la Vida 3D</h1>
        <p>Generación: <span id="generation">0</span></p>
        <p>Población: <span id="population">0</span></p>
        <p>Velocidad: <span id="speed">1x</span></p>
    </div>

    <div id="controls">
        <h2>Controles</h2>
        <button id="playPause">▶ Pausa</button>
        <button id="reset">🔄 Reiniciar</button>
        <button id="random">🎲 Aleatorio</button>
        <button id="zoomIn">🔍+ Zoom In</button>
        <button id="zoomOut">🔍- Zoom Out</button>
        <button id="travel">🚀 Traveling</button>

        <div class="slider-container">
            <label for="gridSize">Tamaño rejilla:</label>
            <input type="range" id="gridSize" min="20" max="100" value="50">
        </div>

        <div class="slider-container">
            <label for="simSpeed">Velocidad:</label>
            <input type="range" id="simSpeed" min="1" max="10" value="5">
        </div>
    </div>

    <div class="view-indicator" id="viewIndicator"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Configuración inicial
        let scene, camera, renderer, controls;
        let gridGroup, starsGroup, cellObjects = [];
        let gridSize = 50;
        let cellSize = 0.9;
        let grid = [];
        let nextGrid = [];
        let isPlaying = true;
        let simulationSpeed = 5;
        let generation = 0;
        let clock = new THREE.Clock();
        let stars = [];
        let starGeometry, starMaterial;

        // Configuración de cámara para diferentes vistas
        const views = {
            city: {
                position: new THREE.Vector3(0, 40, 40),
                lookAt: new THREE.Vector3(0, 0, 0),
                zoom: 1
            },
            street: {
                position: new THREE.Vector3(0, 5, 5),
                lookAt: new THREE.Vector3(0, 0, 0),
                zoom: 10
            },
            individual: {
                position: new THREE.Vector3(0, 2, 2),
                lookAt: new THREE.Vector3(0, 0, 0),
                zoom: 20
            }
        };

        let currentView = 'city';
        let isTraveling = false;
        let travelProgress = 0;
        let targetView = null;

        // Inicializar la escena
        function init() {
            // Crear escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 1, 200);

            // Crear cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 40);
            camera.lookAt(0, 0, 0);

            // Crear renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controles orbitales
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.minDistance = 5;
            controls.maxDistance = 100;

            // Crear luz ambiental
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            // Luz direccional (sol)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 200;
            directionalLight.shadow.camera.left = -60;
            directionalLight.shadow.camera.right = 60;
            directionalLight.shadow.camera.top = 60;
            directionalLight.shadow.camera.bottom = -60;
            scene.add(directionalLight);

            // Luz de punto para efecto 3D
            const pointLight = new THREE.PointLight(0x4fc3f7, 2, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);

            // Crear grupo para la rejilla
            gridGroup = new THREE.Group();
            scene.add(gridGroup);

            // Crear grupo para las estrellas
            starsGroup = new THREE.Group();
            scene.add(starsGroup);

            // Crear campo de estrellas
            createStarField();

            // Crear rejilla del juego
            createGrid();

            // Inicializar con patrón aleatorio
            randomizeGrid();

            // Event listeners
            setupEventListeners();

            // Ocultar loading
            document.getElementById('loading').style.display = 'none';

            // Comenzar animación
            animate();
        }

        // Crear campo de estrellas 3D
        function createStarField() {
            starGeometry = new THREE.BufferGeometry();
            const starVertices = [];
            const starColors = [];

            const numStars = 5000;
            const radius = 200;

            for (let i = 0; i < numStars; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = radius * Math.random();

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                starVertices.push(x, y, z);

                // Color de las estrellas (azules y blancas)
                const color = Math.random() > 0.3 ? 0xffffff : 0x4fc3f7;
                starColors.push(color, color, color);
            }

            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

            starMaterial = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });

            stars = new THREE.Points(starGeometry, starMaterial);
            starsGroup.add(stars);

            // Añadir algunas estrellas más brillantes
            for (let i = 0; i < 100; i++) {
                const starMesh = createRandomStar();
                starsGroup.add(starMesh);
            }
        }

        function createRandomStar() {
            const geometry = new THREE.SphereGeometry(0.3 + Math.random() * 0.5, 8, 8);
            const material = new THREE.MeshBasicMaterial({
                color: Math.random() > 0.5 ? 0xffffff : 0x4fc3f7,
                emissive: Math.random() > 0.5 ? 0x4fc3f7 : 0xffffff,
                emissiveIntensity: 0.5 + Math.random()
            });

            const star = new THREE.Mesh(geometry, material);

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 150 + Math.random() * 50;

            star.position.x = r * Math.sin(phi) * Math.cos(theta);
            star.position.y = r * Math.sin(phi) * Math.sin(theta);
            star.position.z = r * Math.cos(phi);

            // Animación de parpadeo
            star.userData = {
                baseScale: star.scale.x,
                pulseSpeed: 0.5 + Math.random() * 2,
                pulsePhase: Math.random() * Math.PI * 2
            };

            return star;
        }

        // Crear la rejilla del Juego de la Vida
        function createGrid() {
            // Limpiar rejilla existente
            while (gridGroup.children.length > 0) {
                gridGroup.remove(gridGroup.children[0]);
            }

            cellObjects = [];
            grid = [];
            nextGrid = [];

            const halfSize = gridSize / 2;

            // Crear plano base para la ciudad
            const cityPlaneGeometry = new THREE.PlaneGeometry(gridSize * cellSize * 1.1, gridSize * cellSize * 1.1);
            const cityPlaneMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.2
            });
            const cityPlane = new THREE.Mesh(cityPlaneGeometry, cityPlaneMaterial);
            cityPlane.rotation.x = -Math.PI / 2;
            cityPlane.position.y = -0.1;
            cityPlane.receiveShadow = true;
            gridGroup.add(cityPlane);

            // Crear cuadrícula de líneas
            const gridHelper = new THREE.GridHelper(gridSize * cellSize, gridSize, 0x2a2a4a, 0x1a1a2a);
            gridHelper.rotation.x = Math.PI / 2;
            gridHelper.position.y = 0.01;
            gridGroup.add(gridHelper);

            // Crear células
            for (let i = 0; i < gridSize; i++) {
                grid[i] = [];
                nextGrid[i] = [];
                cellObjects[i] = [];

                for (let j = 0; j < gridSize; j++) {
                    grid[i][j] = false;
                    nextGrid[i][j] = false;

                    // Crear objeto 3D para cada celda
                    const cell = createCell(i, j);
                    cellObjects[i][j] = cell;
                    gridGroup.add(cell);
                }
            }

            // Añadir algunos edificios como fondo
            createBackgroundBuildings();
        }

        function createCell(i, j) {
            const geometry = new THREE.BoxGeometry(cellSize * 0.9, 0.1, cellSize * 0.9);
            const material = new THREE.MeshStandardMaterial({
                color: 0x2a2a4a,
                roughness: 0.7,
                metalness: 0.1
            });

            const cell = new THREE.Mesh(geometry, material);

            // Posicionar la celda
            const halfSize = gridSize / 2;
            cell.position.x = (i - halfSize) * cellSize + cellSize / 2;
            cell.position.z = (j - halfSize) * cellSize + cellSize / 2;
            cell.position.y = 0.05;

            cell.castShadow = true;
            cell.receiveShadow = true;

            cell.userData = {
                alive: false,
                row: i,
                col: j,
                baseColor: 0x2a2a4a,
                aliveColor: 0x4fc3f7
            };

            return cell;
        }

        function createBackgroundBuildings() {
            const halfSize = gridSize / 2;
            const buildingGeometry = new THREE.BoxGeometry(1, 3, 1);
            const buildingMaterial = new THREE.MeshStandardMaterial({
                color: 0x3a3a5a,
                roughness: 0.6,
                metalness: 0.2
            });

            // Crear edificios alrededor de la rejilla
            for (let i = 0; i < 10; i++) {
                const building = new THREE.Mesh(buildingGeometry, buildingMaterial);

                const angle = (i / 10) * Math.PI * 2;
                const distance = gridSize * cellSize / 2 + 5;

                building.position.x = Math.cos(angle) * distance;
                building.position.z = Math.sin(angle) * distance;
                building.position.y = 1.5;

                // Variar la altura
                building.scale.y = 2 + Math.random() * 3;
                building.castShadow = true;
                building.receiveShadow = true;

                gridGroup.add(building);
            }
        }

        // Inicializar con patrón aleatorio
        function randomizeGrid() {
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    grid[i][j] = Math.random() > 0.7;
                    updateCellAppearance(cellObjects[i][j], grid[i][j]);
                }
            }
            generation = 0;
            updateStats();
        }

        // Actualizar apariencia de la celda
        function updateCellAppearance(cell, alive) {
            cell.userData.alive = alive;
            cell.material.color.setHex(alive ? cell.userData.aliveColor : cell.userData.baseColor);
            cell.material.emissive.setHex(alive ? 0x4fc3f7 : 0x000000);
            cell.material.emissiveIntensity = alive ? 0.3 : 0;

            // Animación de transición
            cell.scale.y = alive ? 1.2 : 1;
        }

        // Calcular la siguiente generación
        function computeNextGeneration() {
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const neighbors = countLiveNeighbors(i, j);

                    if (grid[i][j]) {
                        // Celula viva
                        nextGrid[i][j] = neighbors === 2 || neighbors === 3;
                    } else {
                        // Celula muerta
                        nextGrid[i][j] = neighbors === 3;
                    }
                }
            }

            // Aplicar cambios
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    grid[i][j] = nextGrid[i][j];
                    updateCellAppearance(cellObjects[i][j], grid[i][j]);
                }
            }

            generation++;
            updateStats();
        }

        // Contar vecinos vivos
        function countLiveNeighbors(row, col) {
            let count = 0;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;

                    const newRow = row + i;
                    const newCol = col + j;

                    if (newRow >= 0 && newRow < gridSize && newCol >= 0 && newCol < gridSize) {
                        if (grid[newRow][newCol]) {
                            count++;
                        }
                    }
                }
            }

            return count;
        }

        // Actualizar estadísticas
        function updateStats() {
            document.getElementById('generation').textContent = generation;

            let population = 0;
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    if (grid[i][j]) population++;
                }
            }
            document.getElementById('population').textContent = population;
        }

        // Configurar event listeners
        function setupEventListeners() {
            // Botones
            document.getElementById('playPause').addEventListener('click', () => {
                isPlaying = !isPlaying;
                document.getElementById('playPause').textContent = isPlaying ? '⏸ Pausa' : '▶ Reanudar';
            });

            document.getElementById('reset').addEventListener('click', () => {
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        grid[i][j] = false;
                        updateCellAppearance(cellObjects[i][j], false);
                    }
                }
                generation = 0;
                updateStats();
            });

            document.getElementById('random').addEventListener('click', randomizeGrid);

            document.getElementById('zoomIn').addEventListener('click', () => {
                if (!isTraveling) {
                    if (currentView === 'city') {
                        travelTo('street');
                    } else if (currentView === 'street') {
                        travelTo('individual');
                    }
                }
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                if (!isTraveling) {
                    if (currentView === 'individual') {
                        travelTo('street');
                    } else if (currentView === 'street') {
                        travelTo('city');
                    }
                }
            });

            document.getElementById('travel').addEventListener('click', () => {
                if (!isTraveling) {
                    if (currentView === 'city') {
                        travelTo('street');
                    } else if (currentView === 'street') {
                        travelTo('individual');
                    } else {
                        travelTo('city');
                    }
                }
            });

            // Sliders
            document.getElementById('gridSize').addEventListener('input', (e) => {
                gridSize = parseInt(e.target.value);
                createGrid();
                randomizeGrid();
            });

            document.getElementById('simSpeed').addEventListener('input', (e) => {
                simulationSpeed = parseInt(e.target.value);
                document.getElementById('speed').textContent = simulationSpeed + 'x';
            });

            // Redimensionar ventana
            window.addEventListener('resize', onWindowResize);

            // Controles de teclado
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    isPlaying = !isPlaying;
                    document.getElementById('playPause').textContent = isPlaying ? '⏸ Pausa' : '▶ Reanudar';
                }
                if (e.code === 'KeyR') {
                    randomizeGrid();
                }
                if (e.code === 'KeyC') {
                    if (!isTraveling) travelTo('city');
                }
                if (e.code === 'KeyS') {
                    if (!isTraveling) travelTo('street');
                }
                if (e.code === 'KeyI') {
                    if (!isTraveling) travelTo('individual');
                }
            });

            // Click en celdas para alternar estado
            renderer.domElement.addEventListener('click', onCanvasClick, false);
        }

        function onCanvasClick(event) {
            if (isTraveling) return;

            // Calcular posición del mouse en coordenadas normalizadas
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Crear rayo desde la cámara
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // Verificar intersección con celdas
            const intersects = raycaster.intersectObjects(cellObjects.flat().flat());

            if (intersects.length > 0) {
                const cell = intersects[0].object;
                const row = cell.userData.row;
                const col = cell.userData.col;

                // Alternar estado
                grid[row][col] = !grid[row][col];
                updateCellAppearance(cell, grid[row][col]);
                updateStats();
            }
        }

        // Transición entre vistas
        function travelTo(target) {
            if (isTraveling) return;

            isTraveling = true;
            targetView = target;
            travelProgress = 0;

            const viewIndicator = document.getElementById('viewIndicator');
            viewIndicator.textContent = getViewName(target);
            viewIndicator.classList.add('visible');

            // Guardar vista actual
            const startView = currentView;

            // Animación de transición
            const animateTravel = () => {
                travelProgress += 0.01 * simulationSpeed;

                if (travelProgress >= 1) {
                    travelProgress = 1;
                    isTraveling = false;
                    currentView = targetView;
                    targetView = null;
                    viewIndicator.classList.remove('visible');
                    return;
                }

                // Interpolación entre vistas
                const startPos = views[startView].position;
                const targetPos = views[target].position;
                const startLookAt = views[startView].lookAt;
                const targetLookAt = views[target].lookAt;

                const pos = new THREE.Vector3();
                pos.lerpVectors(startPos, targetPos, easeInOutQuad(travelProgress));

                const lookAt = new THREE.Vector3();
                lookAt.lerpVectors(startLookAt, targetLookAt, easeInOutQuad(travelProgress));

                camera.position.copy(pos);
                camera.lookAt(lookAt);

                // Ajustar zoom
                const startZoom = views[startView].zoom || 1;
                const targetZoom = views[target].zoom || 1;
                controls.maxDistance = 50 * (startZoom + (targetZoom - startZoom) * travelProgress);
                controls.minDistance = 5 * (startZoom + (targetZoom - startZoom) * travelProgress);

                requestAnimationFrame(animateTravel);
            };

            animateTravel();
        }

        function getViewName(view) {
            switch(view) {
                case 'city': return 'Vista de Ciudad';
                case 'street': return 'Vista de Calle';
                case 'individual': return 'Vista Individual';
                default: return '';
            }
        }

        // Función de easing
        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        // Manejar redimensionamiento de ventana
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animación principal
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar controles
            controls.update();

            // Rotar estrellas para efecto 3D
            starsGroup.rotation.y += 0.0001;

            // Animar estrellas brillantes
            for (let i = 4; i < starsGroup.children.length; i++) {
                const star = starsGroup.children[i];
                if (star.userData) {
                    const time = clock.getElapsedTime();
                    const pulse = Math.sin(time * star.userData.pulseSpeed + star.userData.pulsePhase);
                    star.scale.setScalar(star.userData.baseScale * (0.8 + pulse * 0.2));
                }
            }

            // Animar celdas vivas
            const time = clock.getElapsedTime();
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    if (grid[i][j]) {
                        const cell = cellObjects[i][j];
                        cell.position.y = 0.05 + Math.sin(time * 2 + i + j) * 0.02;
                    }
                }
            }

            // Evolucionar el juego
            const elapsed = clock.getElapsedTime();
            const interval = 0.5 / simulationSpeed;

            if (isPlaying && elapsed > lastUpdate + interval) {
                computeNextGeneration();
                lastUpdate = elapsed;
            }

            // Renderizar
            renderer.render(scene, camera);
        }

        let lastUpdate = 0;

        // Iniciar
        init();
    </script>
</body>
</html>
