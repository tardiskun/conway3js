<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Life 3D Enhanced</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px;
            z-index: 100; backdrop-filter: blur(10px);
        }
        #info h1 { font-size: 20px; margin-bottom: 15px; color: #4fc3f7; }
        #info p { margin: 8px 0; color: #ccc; }
        #controls {
            position: absolute; bottom: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px;
            z-index: 100;
        }
        button {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6); color: white;
            border: none; padding: 10px 20px; margin: 8px; border-radius: 8px;
            cursor: pointer; font-size: 14px; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:hover { background: linear-gradient(135deg, #6bcfff, #4fc3f7); transform: translateY(-3px); }
        .view-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 28px; text-align: center;
            background: rgba(0,0,0,0.9); padding: 25px 50px; border-radius: 20px;
            opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
            z-index: 1000; border: 2px solid #4fc3f7;
        }
        .view-indicator.visible { opacity: 1; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; z-index: 10000;
        }
        .loader {
            width: 60px; height: 60px; border: 4px solid rgba(79, 195, 247, 0.3);
            border-top-color: #4fc3f7; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading"><div class="loader"></div><div>Cargando experiencia...</div></div>
    <div id="info">
        <h1>Juego de la Vida 3D</h1>
        <p>Generacion: <span id="generation">0</span></p>
        <p>Poblacion: <span id="population">0</span></p>
        <p>Velocidad: <span id="speed">1x</span></p>
        <p>Vista: <span id="currentView">Ciudad</span></p>
    </div>
    <div id="controls">
        <button id="playPause">Pausa</button>
        <button id="reset">Reiniciar</button>
        <button id="random">Aleatorio</button>
        <button id="zoomIn">Zoom In</button>
        <button id="zoomOut">Zoom Out</button>
        <button id="travel">Traveling</button>
        <button id="focusCell">Enfocar Celda</button>
        <div><label>Tamanio: <input type="range" id="gridSize" min="20" max="80" value="50"></label></div>
        <div><label>Velocidad: <input type="range" id="simSpeed" min="1" max="20" value="10"></label></div>
    </div>
    <div class="view-indicator" id="viewIndicator"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let gridGroup, starsGroup, nebulaGroup;
        let cellObjects = [];
        let gridSize = 50, cellSize = 0.9;
        let grid = [], nextGrid = [];
        let isPlaying = true, simulationSpeed = 10, generation = 0;
        let clock = new THREE.Clock();
        let currentView = 'city', isTraveling = false, travelProgress = 0, targetView = null, targetCell = null;

        const views = {
            city: { position: new THREE.Vector3(0, 60, 60), lookAt: new THREE.Vector3(0, 0, 0), fov: 75 },
            street: { position: new THREE.Vector3(0, 15, 15), lookAt: new THREE.Vector3(0, 0, 0), fov: 60 },
            individual: { position: new THREE.Vector3(0, 3, 3), lookAt: new THREE.Vector3(0, 0, 0), fov: 45 },
            closeup: { position: new THREE.Vector3(0, 0.5, 0.5), lookAt: new THREE.Vector3(0, 0, 0), fov: 30 }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 1, 300);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.set(0, 60, 60);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.minDistance = 1;
            controls.maxDistance = 200;

            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(50, 50, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.set(2048, 2048);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x4fc3f7, 2, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);

            gridGroup = new THREE.Group();
            scene.add(gridGroup);
            starsGroup = new THREE.Group();
            scene.add(starsGroup);
            nebulaGroup = new THREE.Group();
            scene.add(nebulaGroup);

            createStarField();
            createNebulas();
            createGrid();
            randomizeGrid();
            setupEventListeners();

            setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
            animate();
        }

        function createStarField() {
            const starGeometry = new THREE.BufferGeometry();
            const starVertices = [], starColors = [], starSizes = [];
            const numStars = 8000, radius = 300;

            for (let i = 0; i < numStars; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = radius * Math.pow(Math.random(), 0.5);
                starVertices.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                const color = new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.5 + Math.random() * 0.5, 0.7 + Math.random() * 0.3);
                starColors.push(color.r, color.g, color.b);
                starSizes.push(0.1 + Math.random() * 0.3);
            }

            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
            starGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 0.2, vertexColors: true, transparent: true,
                opacity: 0.8, sizeAttenuation: true, depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            starsGroup.add(new THREE.Points(starGeometry, starMaterial));

            for (let i = 0; i < 150; i++) {
                starsGroup.add(createTwinklingStar());
            }
        }

        function createTwinklingStar() {
            const geometry = new THREE.IcosahedronGeometry(0.2 + Math.random() * 0.8, 0);
            const material = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.6, 0.8, 0.8 + Math.random() * 0.2),
                emissive: new THREE.Color().setHSL(0.6, 0.8, 0.8),
                emissiveIntensity: 0.5 + Math.random() * 1.5, transparent: true, opacity: 0.9
            });
            const star = new THREE.Mesh(geometry, material);
            const theta = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
            const r = 200 + Math.random() * 100;
            star.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            star.userData = { baseScale: star.scale.x, pulseSpeed: 0.3 + Math.random() * 2, pulsePhase: Math.random() * Math.PI * 2 };
            return star;
        }

        function createNebulas() {
            for (let i = 0; i < 3; i++) {
                const group = new THREE.Group();
                for (let j = 0; j < 5; j++) {
                    const geometry = new THREE.SphereGeometry(20 + Math.random() * 40, 32, 32);
                    const material = new THREE.MeshBasicMaterial({
                        color: new THREE.Color().setHSL(0.55 + Math.random() * 0.1, 0.5, 0.1),
                        transparent: true, opacity: 0.03 + Math.random() * 0.05, side: THREE.BackSide
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
                    group.add(sphere);
                }
                group.position.set((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300);
                nebulaGroup.add(group);
            }
        }

        function createGrid() {
            while (gridGroup.children.length > 0) gridGroup.remove(gridGroup.children[0]);
            cellObjects = []; grid = []; nextGrid = [];

            const cityPlaneGeometry = new THREE.PlaneGeometry(gridSize * cellSize * 1.1, gridSize * cellSize * 1.1);
            const cityPlaneMaterial = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.9, metalness: 0.1 });
            const cityPlane = new THREE.Mesh(cityPlaneGeometry, cityPlaneMaterial);
            cityPlane.rotation.x = -Math.PI / 2; cityPlane.position.y = -0.2; cityPlane.receiveShadow = true;
            gridGroup.add(cityPlane);

            const gridHelper = new THREE.GridHelper(gridSize * cellSize, gridSize, 0x1a2a4a, 0x0a0a1a);
            gridHelper.rotation.x = Math.PI / 2; gridHelper.position.y = 0.01;
            gridGroup.add(gridHelper);

            for (let i = 0; i < gridSize; i++) {
                grid[i] = []; nextGrid[i] = []; cellObjects[i] = [];
                for (let j = 0; j < gridSize; j++) {
                    grid[i][j] = false; nextGrid[i][j] = false;
                    cellObjects[i][j] = createCell(i, j);
                    gridGroup.add(cellObjects[i][j]);
                }
            }
            createBackgroundBuildings();
        }

        function createCell(i, j) {
            const geometry = new THREE.BoxGeometry(cellSize * 0.9, 0.15, cellSize * 0.9);
            const material = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.6, metalness: 0.2 });
            const cell = new THREE.Mesh(geometry, material);
            const halfSize = gridSize / 2;
            cell.position.set((i - halfSize) * cellSize + cellSize / 2, 0.075, (j - halfSize) * cellSize + cellSize / 2);
            cell.castShadow = true; cell.receiveShadow = true;
            cell.userData = { alive: false, row: i, col: j, baseColor: 0x1a1a2e, aliveColor: new THREE.Color().setHSL(0.55, 0.8, 0.5) };
            return cell;
        }

        function createBackgroundBuildings() {
            for (let i = 0; i < 15; i++) {
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.55, 0.3, 0.2 + Math.random() * 0.2), roughness: 0.7 });
                const building = new THREE.Mesh(geometry, material);
                const angle = (i / 15) * Math.PI * 2, distance = gridSize * cellSize / 2 + 3 + Math.random() * 5;
                building.position.set(Math.cos(angle) * distance, 0.5 + Math.random() * 2, Math.sin(angle) * distance);
                building.scale.set(0.8 + Math.random() * 0.4, 2 + Math.random() * 5, 0.8 + Math.random() * 0.4);
                building.castShadow = true; building.receiveShadow = true;
                gridGroup.add(building);
            }
        }

        function randomizeGrid() {
            for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) {
                grid[i][j] = Math.random() > 0.85; updateCellAppearance(cellObjects[i][j], grid[i][j]);
            }
            generation = 0; updateStats();
        }

        function updateCellAppearance(cell, alive) {
            cell.userData.alive = alive;
            cell.material.color.copy(alive ? cell.userData.aliveColor : cell.userData.baseColor);
            cell.material.emissive.setHex(alive ? 0x4fc3f7 : 0x000000);
            cell.material.emissiveIntensity = alive ? 0.5 : 0;
            cell.scale.set(1, alive ? 1.3 : 1, 1);
        }

        function computeNextGeneration() {
            for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) {
                const neighbors = countLiveNeighbors(i, j);
                nextGrid[i][j] = grid[i][j] ? (neighbors === 2 || neighbors === 3) : (neighbors === 3);
            }
            for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) {
                grid[i][j] = nextGrid[i][j]; updateCellAppearance(cellObjects[i][j], grid[i][j]);
            }
            generation++; updateStats();
        }

        function countLiveNeighbors(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
                if (i === 0 && j === 0) continue;
                const newRow = row + i, newCol = col + j;
                if (newRow >= 0 && newRow < gridSize && newCol >= 0 && newCol < gridSize && grid[newRow][newCol]) count++;
            }
            return count;
        }

        function updateStats() {
            document.getElementById('generation').textContent = generation;
            document.getElementById('currentView').textContent = getViewName(currentView);
            let population = 0;
            for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) if (grid[i][j]) population++;
            document.getElementById('population').textContent = population;
        }

        function getViewName(view) {
            const names = { city: 'Ciudad', street: 'Calle', individual: 'Individual', closeup: 'Primer Plano' };
            return names[view] || '';
        }

        function focusOnCell(row, col) {
            if (isTraveling) return;
            targetCell = cellObjects[row][col]; isTraveling = true; travelProgress = 0; targetView = 'closeup';
            const viewIndicator = document.getElementById('viewIndicator');
            viewIndicator.textContent = 'Enfocando celda (' + row + ',' + col + ')'; viewIndicator.classList.add('visible');
            const startPosition = camera.position.clone(), startLookAt = controls.target.clone();
            const targetPosition = targetCell.position.clone(); targetPosition.y += 1; targetPosition.x += 0.5; targetPosition.z += 0.5;
            const animateFocus = () => {
                travelProgress += 0.02 * simulationSpeed;
                if (travelProgress >= 1) { isTraveling = false; currentView = 'closeup'; targetView = null; targetCell = null; viewIndicator.classList.remove('visible'); return; }
                const pos = new THREE.Vector3().lerpVectors(startPosition, targetPosition, easeInOutCubic(travelProgress));
                const lookAt = new THREE.Vector3().lerpVectors(startLookAt, targetCell.position, easeInOutCubic(travelProgress));
                camera.position.copy(pos); controls.target.copy(lookAt); controls.update();
                camera.fov = 75 + (30 - 75) * travelProgress; camera.updateProjectionMatrix();
                requestAnimationFrame(animateFocus);
            }; animateFocus();
        }

        function travelTo(target) {
            if (isTraveling) return;
            isTraveling = true; targetView = target; travelProgress = 0;
            const viewIndicator = document.getElementById('viewIndicator');
            viewIndicator.textContent = getViewName(target); viewIndicator.classList.add('visible');
            const startView = currentView;
            const animateTravel = () => {
                travelProgress += 0.015 * simulationSpeed;
                if (travelProgress >= 1) { isTraveling = false; currentView = targetView; targetView = null; targetCell = null; viewIndicator.classList.remove('visible'); updateStats(); return; }
                const startPos = views[startView].position, targetPos = views[target].position;
                const startLookAt = views[startView].lookAt, targetLookAt = views[target].lookAt;
                const pos = new THREE.Vector3().lerpVectors(startPos, targetPos, easeInOutCubic(travelProgress));
                const lookAt = new THREE.Vector3().lerpVectors(startLookAt, targetLookAt, easeInOutCubic(travelProgress));
                camera.position.copy(pos); controls.target.copy(lookAt); controls.update();
                const startFov = views[startView].fov || 75, targetFov = views[target].fov || 75;
                camera.fov = startFov + (targetFov - startFov) * travelProgress; camera.updateProjectionMatrix();
                requestAnimationFrame(animateTravel);
            }; animateTravel();
        }

        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

        function setupEventListeners() {
            document.getElementById('playPause').addEventListener('click', () => {
                isPlaying = !isPlaying; document.getElementById('playPause').textContent = isPlaying ? 'Pausa' : 'Reanudar';
            });
            document.getElementById('reset').addEventListener('click', () => {
                for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) { grid[i][j] = false; updateCellAppearance(cellObjects[i][j], false); }
                generation = 0; updateStats();
            });
            document.getElementById('random').addEventListener('click', randomizeGrid);
            document.getElementById('zoomIn').addEventListener('click', () => {
                if (!isTraveling) {
                    const order = ['city', 'street', 'individual', 'closeup'];
                    const currentIndex = order.indexOf(currentView);
                    if (currentIndex < order.length - 1) travelTo(order[currentIndex + 1]);
                }
            });
            document.getElementById('zoomOut').addEventListener('click', () => {
                if (!isTraveling) {
                    const order = ['closeup', 'individual', 'street', 'city'];
                    const currentIndex = order.indexOf(currentView);
                    if (currentIndex < order.length - 1) travelTo(order[currentIndex + 1]);
                }
            });
            document.getElementById('travel').addEventListener('click', () => {
                if (!isTraveling) {
                    const order = ['city', 'street', 'individual', 'closeup'];
                    const currentIndex = order.indexOf(currentView);
                    travelTo(order[(currentIndex + 1) % order.length]);
                }
            });
            document.getElementById('focusCell').addEventListener('click', () => {
                for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) {
                    if (grid[i][j]) { focusOnCell(i, j); return; }
                }
                focusOnCell(Math.floor(gridSize / 2), Math.floor(gridSize / 2));
            });
            document.getElementById('gridSize').addEventListener('input', (e) => { gridSize = parseInt(e.target.value); createGrid(); randomizeGrid(); });
            document.getElementById('simSpeed').addEventListener('input', (e) => { simulationSpeed = parseInt(e.target.value); document.getElementById('speed').textContent = simulationSpeed + 'x'; });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') { isPlaying = !isPlaying; document.getElementById('playPause').textContent = isPlaying ? 'Pausa' : 'Reanudar'; }
                if (e.code === 'KeyR') randomizeGrid();
                if (e.code === 'KeyF') document.getElementById('focusCell').click();
            });
            renderer.domElement.addEventListener('click', (event) => {
                if (isTraveling) return;
                const rect = renderer.domElement.getBoundingClientRect();
                const mouse = new THREE.Vector2(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
                const raycaster = new THREE.Raycaster(); raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(cellObjects.flat().flat());
                if (intersects.length > 0) {
                    const cell = intersects[0].object, row = cell.userData.row, col = cell.userData.col;
                    grid[row][col] = !grid[row][col]; updateCellAppearance(cell, grid[row][col]); updateStats();
                }
            }, false);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime(), delta = clock.getDelta();
            controls.update();
            starsGroup.rotation.y += 0.00005 * delta * 60;
            nebulaGroup.rotation.y += 0.00002 * delta * 60;
            for (let i = 1; i < starsGroup.children.length; i++) {
                const star = starsGroup.children[i];
                if (star.userData) {
                    const pulse = Math.sin(time * star.userData.pulseSpeed + star.userData.pulsePhase);
                    star.scale.setScalar(star.userData.baseScale * (0.7 + pulse * 0.3));
                }
            }
            for (let i = 0; i < gridSize; i++) for (let j = 0; j < gridSize; j++) {
                if (grid[i][j]) cellObjects[i][j].position.y = 0.075 + Math.sin(time * 3 + i * 0.5 + j * 0.3) * 0.03;
            }
            if (isPlaying) {
                const interval = 0.3 / simulationSpeed;
                if (time > lastUpdate + interval) { computeNextGeneration(); lastUpdate = time; }
            }
            renderer.render(scene, camera);
        }

        let lastUpdate = 0; init();
    </script>
</body>
</html>
